<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Мастера — админ-панель</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/styles.css">
</head>
<body data-header="admin">
<div id="site-header"></div>

<main class="booking-narrow" style="padding-top:var(--sp-5); padding-bottom:var(--sp-8)">
  <nav class="tabs" data-admin-tabs="/admin/masters" style="margin-bottom:var(--sp-6)"></nav>
  <div class="page-head">
    <div>
      <h2 class="booking-title">Мастера</h2>
      <p class="booking-sub">Команда, услуги каждого мастера и график работы.</p>
    </div>
    <button class="btn btn--primary" type="button" id="master-add">Добавить мастера</button>
  </div>
  <div class="admin-list" id="masters-list"><div class="spinner"></div></div>
  <p class="booking-card__note" style="margin-top:var(--sp-5)">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>
    Отключённый мастер не показывается при новой записи, но сохраняется в старых записях
  </p>
</main>

<!-- Модальное окно: форма мастера -->
<div class="modal-overlay" id="modal-master" role="dialog" aria-modal="true">
  <form class="modal modal--wide" id="master-form" novalidate>
    <p class="modal__title" id="mm-title">Добавить мастера</p>
    <div class="modal__form" style="text-align:left">
      <label class="field">
        <span class="field__label">Имя</span>
        <input class="field__input" type="text" id="mm-name" placeholder="Имя и фамилия">
      </label>
      <div class="field">
        <span class="field__label">Услуги мастера</span>
        <div style="display:flex; flex-direction:column; gap:8px; margin-top:2px" id="mm-services"></div>
      </div>
      <div class="field">
        <span class="field__label">График по дням недели</span>
        <div class="sched" id="mm-sched"></div>
      </div>
    </div>
<div class="auth-error alert" id="mm-error" role="alert" style="margin-top:var(--sp-4); text-align:left">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>
      <span data-error-text></span>
    </div>
    <div class="modal__actions">
      <button class="btn btn--secondary" type="button" data-close>Отмена</button>
      <button class="btn btn--primary" type="submit">Сохранить</button>
    </div>
  </form>
</div>

<script src="/js/mock-data.js"></script>
<script src="/js/api.js"></script>
<script src="/js/ui.js"></script>
<script src="/js/pages/admin-masters.js"></script>
</body>
</html>
