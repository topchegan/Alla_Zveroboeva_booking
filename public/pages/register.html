<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Регистрация — Алла Зверобоева</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/styles.css">
</head>
<body data-header="guest">
<main class="auth-wrap">
  <div class="auth-card">
      <a class="logo auth-card__logo" href="/">
        <span class="logo__mark">АЗ</span>
        <span class="logo__text">Алла Зверобоева<small>студия маникюра и бровей</small></span>
      </a>
    <h2 class="auth-card__title">Регистрация</h2>
    <p class="auth-card__sub">Займёт меньше минуты — понадобятся только имя и email.</p>
    <form class="auth-form" id="register-form" novalidate>
      <div class="field">
        <label class="field__label" for="reg-name">Имя</label>
        <input class="field__input" id="reg-name" type="text" placeholder="Как к вам обращаться" autocomplete="name" required>
      </div>
      <div class="field">
        <label class="field__label" for="reg-email">Email</label>
        <input class="field__input" id="reg-email" type="email" placeholder="you@example.ru" autocomplete="email" required>
      </div>
      <div class="field">
        <label class="field__label" for="reg-pass">Пароль</label>
        <input class="field__input" id="reg-pass" type="password" placeholder="Придумайте пароль" autocomplete="new-password" required>
      </div>
      <div class="field">
        <label class="field__label" for="reg-pass2">Повтор пароля</label>
        <input class="field__input" id="reg-pass2" type="password" placeholder="Повторите пароль" autocomplete="new-password" required>
      </div>
      <button class="btn btn--primary btn--block" type="submit">Зарегистрироваться</button>
    </form>
    <div class="auth-error alert" id="register-error" role="alert">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>
      <span data-error-text></span>
    </div>
    <div class="auth-links">
      <span>Уже есть аккаунт? <a href="/login">Войти</a></span>
    </div>
  </div>
</main>

<script src="/js/mock-data.js"></script>
<script src="/js/api.js"></script>
<script src="/js/ui.js"></script>
<script src="/js/pages/register.js"></script>
</body>
</html>
