<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Восстановление пароля — Алла Зверобоева</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/styles.css">
</head>
<body data-header="guest">
<main class="auth-wrap">
  <div class="auth-card">
      <a class="logo auth-card__logo" href="/">
        <span class="logo__mark">АЗ</span>
        <span class="logo__text">Алла Зверобоева<small>студия маникюра и бровей</small></span>
      </a>
    <h2 class="auth-card__title">Восстановление пароля</h2>
    <div class="auth-form">
      <div class="field">
        <label class="field__label" for="forgot-email">Email</label>
        <input class="field__input" id="forgot-email" type="email" placeholder="you@example.ru" autocomplete="email">
      </div>
    </div>
    <div class="auth-note">
      Функция появится позже. Пока обратитесь к администратору салона:
      <b>+7 (900) 000-00-00</b>
    </div>
    <div class="auth-links">
      <a href="/login">← Вернуться ко входу</a>
    </div>
  </div>
</main>

<script src="/js/mock-data.js"></script>
<script src="/js/api.js"></script>
<script src="/js/ui.js"></script>
</body>
</html>
