<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Вход — Алла Зверобоева</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/styles.css">
</head>
<body data-header="guest">
<main class="auth-wrap">
  <div class="auth-card">
      <a class="logo auth-card__logo" href="/">
        <span class="logo__mark">АЗ</span>
        <span class="logo__text">Алла Зверобоева<small>студия маникюра и бровей</small></span>
      </a>
    <h2 class="auth-card__title">Вход</h2>
    <p class="auth-card__sub">Войдите, чтобы записаться и управлять своими записями.</p>
    <form class="auth-form" id="login-form" novalidate>
      <div class="field">
        <label class="field__label" for="login-email">Email</label>
        <input class="field__input" id="login-email" type="email" placeholder="you@example.ru" autocomplete="email" required>
      </div>
      <div class="field">
        <label class="field__label" for="login-pass">Пароль</label>
        <input class="field__input" id="login-pass" type="password" placeholder="••••••••" autocomplete="current-password" required>
      </div>
      <button class="btn btn--primary btn--block" type="submit">Войти</button>
    </form>
    <div class="auth-error alert" id="login-error" role="alert">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>
      <span data-error-text>Неверный email или пароль</span>
    </div>
    <div class="auth-links">
      <a href="/forgot-password">Забыли пароль?</a>
      <span>Нет аккаунта? <a href="/register">Зарегистрироваться</a></span>
    </div>
  </div>
</main>

<script src="/js/mock-data.js"></script>
<script src="/js/api.js"></script>
<script src="/js/ui.js"></script>
<script src="/js/pages/login.js"></script>
</body>
</html>
